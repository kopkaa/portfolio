<!--
  Source for public/og-default.png (the social preview card).

  Regenerate after editing:
    chrome --headless=new --disable-gpu --hide-scrollbars            --force-device-scale-factor=1 --window-size=1200,630            --virtual-time-budget=6000            --screenshot=public/og-default.png scripts/og-template.html

  Kept as HTML rather than a checked-in-only PNG so the card stays editable.
  1200x630 is the size Facebook, LinkedIn and X all crop cleanly from.
-->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&family=Rubik:wght@600;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:#090b11;
    font-family:'Public Sans',system-ui,sans-serif;
    color:#fff;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 84px;position:relative;
  }
  /* svetelny gradient v hornim rohu, jako na webu */
  .glow{
    position:absolute;inset:0;
    background:
      radial-gradient(1500px 780px at 26% -18%,
        rgba(118,17,166,.82) 0%, rgba(154,58,214,.44) 26%,
        rgba(197,97,246,.26) 44%, rgba(99,102,241,.14) 60%, transparent 76%),
      radial-gradient(760px 420px at 88% -6%,
        rgba(99,102,241,.22) 0%, transparent 70%);
  }
  .grain{position:absolute;inset:0;opacity:.5;
    background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px);
    background-size:4px 4px}
  .inner{position:relative;z-index:1}
  .eyebrow{
    font-size:23px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
    color:#c561f6;margin-bottom:26px;
  }
  h1{
    font-family:'Rubik','Public Sans',sans-serif;
    font-size:104px;font-weight:800;line-height:1.02;letter-spacing:-.03em;
    background:linear-gradient(to right in srgb,#e9d5ff 0%,#c561f6 52%,#818cf8 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:30px;
  }
  .role{font-size:41px;font-weight:400;color:#c3cadb;letter-spacing:-.01em}
  .stack{display:flex;gap:13px;margin-top:44px;flex-wrap:wrap}
  .chip{
    font-size:22px;font-weight:600;padding:11px 21px;border-radius:999px;
    color:#e3e6ee;background:rgba(197,97,246,.11);
    border:1px solid rgba(197,97,246,.32);
  }
  .foot{
    position:absolute;bottom:52px;left:84px;right:84px;z-index:1;
    display:flex;justify-content:space-between;align-items:center;
    font-size:25px;color:#8490b5;
  }
  .foot b{color:#c561f6;font-weight:700}
  .rule{position:absolute;bottom:128px;left:84px;right:84px;height:1px;
    background:linear-gradient(to right,rgba(197,97,246,.42),transparent)}
</style></head>
<body>
  <div class="glow"></div><div class="grain"></div>
  <div class="inner">
    <div class="eyebrow">Ostrava · Czechia</div>
    <h1>Jan&nbsp;Hromádka</h1>
    <div class="role">Full-Stack Web Developer</div>
    <div class="stack">
      <span class="chip">Vue</span><span class="chip">Nuxt</span>
      <span class="chip">Node.js</span><span class="chip">Kotlin</span>
      <span class="chip">AWS</span><span class="chip">Terraform</span>
    </div>
  </div>
  <div class="rule"></div>
  <div class="foot"><span><b>jhromadka.dev</b></span><span>6+ years across the stack</span></div>
</body></html>
